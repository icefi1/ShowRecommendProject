<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Recommender</title>
<style>
  :root {
    --bg: #12131a;
    --panel: #1b1d27;
    --panel-2: #232634;
    --line: #303446;
    --text: #e7e9f0;
    --muted: #969ab0;
    --accent: #7aa2f7;
    --good: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  #account { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #account .who { color: var(--muted); }
  #account .who b { color: var(--text); }
  .libtabs { display: flex; gap: 4px; }
  .libtab {
    padding: 6px 11px; border-radius: 20px; cursor: pointer; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .libtab[aria-selected="true"] { background: var(--accent); color: #12131a; border-color: var(--accent); font-weight: 600; }
  .status-row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .status {
    padding: 6px 13px; border-radius: 20px; cursor: pointer; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .status[aria-pressed="true"] { background: var(--good); color: #12131a; border-color: var(--good); font-weight: 600; }
  textarea {
    width: 100%; min-height: 90px; padding: 10px 12px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 14px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .review { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .review .by { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 74px); }
  aside { border-right: 1px solid var(--line); padding: 20px; background: var(--panel); }
  main { padding: 20px 28px; min-width: 0; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); user-select: none;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: #12131a; font-weight: 600; border-color: var(--accent); }

  label.field { display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; padding: 9px 11px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  .results-list { margin-top: 6px; max-height: 210px; overflow-y: auto; }
  .hit {
    padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .hit:hover { background: var(--panel-2); }
  .hit span:last-child { color: var(--muted); flex-shrink: 0; }

  .chosen {
    margin-top: 10px; padding: 10px 12px; background: var(--panel-2);
    border: 1px solid var(--accent); border-radius: 6px; font-size: 14px;
  }
  .chosen small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .slider-row { margin: 12px 0; }
  .slider-row header { display: flex; justify-content: space-between; padding: 0;
    border: 0; font-size: 13px; margin-bottom: 3px; }
  .slider-row .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .genre-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .genre {
    padding: 4px 9px; font-size: 12px; border-radius: 20px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .genre[aria-pressed="true"] { background: var(--accent); color: #12131a; border-color: var(--accent); font-weight: 600; }

  .meta-line { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .meta-line b { color: var(--good); font-weight: 600; }

  .card {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px;
    padding: 12px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .card img { width: 56px; height: 84px; object-fit: cover; border-radius: 4px; background: var(--panel-2); }
  .card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .why { font-size: 13px; color: #c3c8da; }
  .card .why em { color: var(--accent); font-style: normal; }
  .score { text-align: right; font-variant-numeric: tabular-nums; }
  .score .big { font-size: 17px; font-weight: 600; color: var(--good); }
  .score .parts { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

  .card { cursor: pointer; transition: border-color .12s, background .12s; }
  .card:hover { border-color: var(--accent); background: var(--panel-2); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Paging control under the results. It doubles as the scroll sentinel: when
     it comes into view the next page loads itself, so the button is the manual
     fallback rather than the only way through. */
  .more { padding: 4px 0 40px; text-align: center; }
  .more button {
    padding: 10px 22px; font-size: 13px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .more button:hover { border-color: var(--accent); }
  .more button[disabled] { color: var(--muted); cursor: default; border-color: var(--line); }
  .more .exhausted { color: var(--muted); font-size: 12px; }

  /* --- detail panel ------------------------------------------------------ */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,9,13,.72);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 20px; overflow-y: auto; z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: min(760px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 22px;
  }
  .sheet-head { display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; }
  .sheet-head img { width: 92px; border-radius: 6px; background: var(--panel-2); }
  .sheet h2 { margin: 0 0 3px; font-size: 21px; }
  .sheet .sub { color: var(--muted); font-size: 13px; }
  .sheet .overview { margin: 14px 0 0; font-size: 14px; color: #c8cddd; }
  .close {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 16px;
  }
  .close:hover { color: var(--text); border-color: var(--accent); }

  .sheet h4 {
    margin: 20px 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); font-weight: 600;
  }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 132px 1fr 38px; gap: 9px; align-items: center; font-size: 12px; }
  .bar .track { height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar .fill.measured { background: var(--good); }
  .bar .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    padding: 3px 9px; font-size: 12px; border-radius: 20px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  /* Age certificate. Immutable - awarded by a classification body, never
     predicted and never voted on. */
  .cert {
    display: inline-block; padding: 0 5px; margin-right: 6px; border-radius: 3px;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    border: 1px solid var(--muted); color: var(--muted);
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

  /* --- voting ------------------------------------------------------------ */
  .vbar { display: grid; grid-template-columns: 118px 1fr 40px 92px 62px; gap: 9px;
    align-items: center; font-size: 12px; padding: 3px 0; }
  .votes { display: flex; gap: 3px; }
  .vote {
    width: 27px; height: 22px; padding: 0; cursor: pointer; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; line-height: 1;
  }
  .vote:hover { color: var(--text); border-color: var(--accent); }
  .vote[aria-pressed="true"] { background: var(--accent); color: #12131a; border-color: var(--accent); font-weight: 700; }
  .vote.down[aria-pressed="true"] { background: #f7768e; border-color: #f7768e; }
  .vote.neutral[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
  .tally { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tally .drift { color: var(--accent); }
  /* Facts are dimmed so the eye goes to the axes that are actually open. */
  .vbar.fact { opacity: .68; }
  .vbar.fact .fill { background: var(--muted); }
  .sourced { font-size: 11px; color: var(--muted); text-align: center; }
  .sheet-actions { margin-top: 20px; display: flex; gap: 8px; }
  .btn {
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    background: var(--accent); color: #12131a; border: 0; font-weight: 600;
  }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  footer { padding: 14px 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Show Recommender</h1>
    <p>Search a title or describe what you want. Every result explains itself.</p>
  </div>
  <nav id="account"></nav>
</header>

<div class="layout">
  <aside>
    <div class="tabs" role="tablist">
      <div class="tab" role="tab" id="tab-show" aria-selected="true">By show</div>
      <div class="tab" role="tab" id="tab-pref" aria-selected="false">By preference</div>
    </div>

    <section id="panel-show">
      <label class="field" for="q">Find a show</label>
      <input type="text" id="q" placeholder="Breaking Bad, Peaky Blinders&hellip;" autocomplete="off">
      <div class="results-list" id="hits"></div>
      <div id="chosen"></div>
    </section>

    <section id="panel-pref" hidden>
      <label class="field">Genres</label>
      <div class="genre-grid" id="genres"></div>
      <label class="field">Shape of the thing</label>
      <div id="structure-dials"></div>
    </section>

    <label class="field">Block weights</label>
    <div id="weights"></div>
  </aside>

  <main>
    <div class="meta-line" id="meta"></div>
    <div id="results"><div class="empty">Pick a show, or switch to preference mode.</div></div>
    <div class="more" id="more"></div>
  </main>
</div>

<div class="overlay" id="detail" hidden><div class="sheet" id="sheet"></div></div>

<footer>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>

<script>
const $ = (s) => document.querySelector(s);
const state = {
  mode: "show", show: null, weights: {}, structure: {}, genres: new Set(), axes: null,
  // Paging: how many results are on screen, how many the query can return, and
  // a guard so the scroll sentinel cannot fire a second request while the first
  // one is still in flight.
  shown: 0, total: 0, loading: false,
  // Bumped by every fresh query, so a response that arrives after a newer
  // query has started can be recognised as stale and discarded.
  generation: 0,
};

// Results per request. The ranking is over the whole catalogue either way -
// this only decides how much of it arrives at once.
const PAGE_SIZE = 24;

// Axes the dials expose. The structure block has more axes than this, but a
// wall of 13 sliders is not "usable in ten seconds" - these are the ones a
// person can form an intention about.
const DIAL_LABELS = {
  episode_count:  ["Few episodes", "Many episodes"],
  season_count:   ["One season", "Many seasons"],
  episode_length: ["Short episodes", "Long episodes"],
  maturity:       ["Family friendly", "Very adult"],
  audience_rating:["Any reception", "Highly rated"],
  slow_burn_slope:["Strong from the start", "Slow burn"],
  guest_star_mean:["Tight core cast", "Large ensemble"],
  entity_density: ["Simple cast", "Many names to track"],
};

async function boot() {
  state.axes = await (await fetch("/api/axes")).json();
  state.weights = { ...state.axes.default_weights };
  drawWeights();
  drawGenres();
  drawDials();
  $("#meta").textContent =
    `${state.axes.catalogue_size} shows · ${state.axes.genres.length} genres · `
    + `${state.axes.keyword_count} keyword dimensions · ${state.axes.structure.length} structure axes`;
}

function drawWeights() {
  $("#weights").innerHTML = Object.keys(state.weights).map((name) => `
    <div class="slider-row">
      <header><span>${name}</span><span class="val" id="wv-${name}">${state.weights[name].toFixed(2)}</span></header>
      <input type="range" min="0" max="1" step="0.05" value="${state.weights[name]}" data-weight="${name}">
    </div>`).join("");

  $("#weights").oninput = (e) => {
    const name = e.target.dataset.weight;
    state.weights[name] = parseFloat(e.target.value);
    $(`#wv-${name}`).textContent = state.weights[name].toFixed(2);
    run();
  };
}

function drawGenres() {
  $("#genres").innerHTML = state.axes.genres
    .map((g) => `<div class="genre" role="button" aria-pressed="false" data-genre="${g}">${g}</div>`).join("");
  $("#genres").onclick = (e) => {
    const el = e.target.closest("[data-genre]");
    if (!el) return;
    const on = el.getAttribute("aria-pressed") === "true";
    el.setAttribute("aria-pressed", String(!on));
    on ? state.genres.delete(el.dataset.genre) : state.genres.add(el.dataset.genre);
    run();
  };
}

function drawDials() {
  const available = state.axes.structure.filter((a) => DIAL_LABELS[a]);
  $("#structure-dials").innerHTML = available.map((axis) => {
    state.structure[axis] = 0.5;
    const [low, high] = DIAL_LABELS[axis];
    return `
      <div class="slider-row">
        <header><span>${low}</span><span style="color:var(--muted)">${high}</span></header>
        <input type="range" min="0" max="1" step="0.05" value="0.5" data-axis="${axis}">
      </div>`;
  }).join("");

  $("#structure-dials").oninput = (e) => {
    state.structure[e.target.dataset.axis] = parseFloat(e.target.value);
    run();
  };
}

// --- search -----------------------------------------------------------------

let searchTimer;
$("#q").oninput = (e) => {
  clearTimeout(searchTimer);
  const term = e.target.value;
  // Debounced so a fast typist does not fire a request per keystroke.
  searchTimer = setTimeout(async () => {
    if (!term.trim()) { $("#hits").innerHTML = ""; return; }
    const data = await (await fetch(`/api/search?q=${encodeURIComponent(term)}`)).json();
    $("#hits").innerHTML = data.results.map((s) =>
      `<div class="hit" data-id="${s.id}"><span>${s.name}</span><span>${s.year}</span></div>`).join("")
      || `<div class="hit"><span style="color:var(--muted)">No match</span></div>`;
  }, 140);
};

$("#hits").onclick = (e) => {
  const el = e.target.closest("[data-id]");
  if (!el) return;
  pickShow(parseInt(el.dataset.id, 10));
};

function pickShow(id) {
  state.show = id;
  $("#hits").innerHTML = "";
  $("#q").value = "";
  // The chosen show's details come back on the query response, so there is no
  // second lookup here.
  run();
}

// --- querying ---------------------------------------------------------------

function prompt(message) {
  $("#results").innerHTML = `<div class="empty">${message}</div>`;
  clearPaging();
  $("#meta").innerHTML =
    `${state.axes.catalogue_size} shows · ${state.axes.keyword_count} keyword dimensions `
    + `· ${state.axes.structure.length} structure axes`;
}

// Called whenever something other than paging fills the results column, so a
// stale "show more" button cannot page a query that is no longer on screen.
function clearPaging() {
  state.shown = 0;
  state.total = 0;
  $("#more").innerHTML = "";
}

async function run(append = false) {
  // Paging is the only thing that must not overlap itself: two appends in
  // flight together would add the same page twice. A fresh query is allowed to
  // interrupt anything.
  if (append && state.loading) return;
  if (!append) state.generation++;
  const generation = state.generation;
  // Changing a weight, a dial or the chosen show restarts the ranking from the
  // top. Only the paging control appends to what is already there.
  const offset = append ? state.shown : 0;

  let data;
  let showQuery;
  state.loading = true;
  try {
    if (state.mode === "show") {
      if (!state.show) return prompt("Search for a show to see what it sits near.");
      const w = state.weights;
      const url = `/api/similar/${state.show}?genre=${w.genre}&keywords=${w.keywords}`
        + `&structure=${w.structure}&limit=${PAGE_SIZE}&offset=${offset}`;
      data = await (await fetch(url)).json();
      showQuery = true;
    } else {
      // A query where every dial sits at its neutral midpoint and no genre is
      // chosen expresses no preference at all. Ranking against it returns
      // whatever happens to sit nearest the centre of the space, which looks
      // like a result but means nothing. Ask for an intention instead.
      const moved = Object.values(state.structure).some((v) => v !== 0.5);
      if (!moved && state.genres.size === 0) {
        return prompt("Pick a genre or move a dial to describe what you want.");
      }

      data = await (await fetch("/api/preference", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          structure: state.structure,
          genres: [...state.genres],
          weights: state.weights,
          limit: PAGE_SIZE,
          offset,
        }),
      })).json();
      showQuery = false;
    }
  } finally {
    state.loading = false;
  }

  // A newer query started while this one was in flight - dragging a dial fires
  // one per step - so these results are already stale. Dropping them here is
  // what stops an old response overwriting a newer one.
  if (generation !== state.generation) return;
  render(data, showQuery, append);
}

function render(data, showQuery, append = false) {
  if (showQuery && data.query_show) {
    const q = data.query_show;
    $("#chosen").innerHTML =
      `<div class="chosen">${q.name}<small>${q.year} · ${q.genres.join(", ")} · ${q.episodes} episodes</small></div>`;
  }

  if (!append && !data.results.length) {
    $("#results").innerHTML = `<div class="empty">Nothing matched.</div>`;
    clearPaging();
    return;
  }

  // One renderer for search results and library listings alike. They had
  // drifted apart, and a change made to one silently missed the other.
  const cards = data.results.map(showCard).join("");
  if (append) {
    // Appending rather than replacing is what makes this one continuous list
    // to scroll rather than a set of pages that lose your place.
    $("#results").insertAdjacentHTML("beforeend", cards);
    state.shown += data.results.length;
  } else {
    $("#results").innerHTML = cards;
    state.shown = data.results.length;
    window.scrollTo({ top: 0 });
  }
  state.total = data.total ?? state.shown;

  $("#meta").innerHTML =
    `showing ${state.shown} of ${state.total} · <b>${data.query_ms} ms</b> · `
    + `${state.axes.catalogue_size} shows · ${state.axes.keyword_count} keyword dimensions`;
  drawPaging();
}

function drawPaging() {
  const remaining = state.total - state.shown;
  $("#more").innerHTML = remaining > 0
    ? `<button id="more-btn">Show ${Math.min(PAGE_SIZE, remaining)} more · ${remaining} left</button>`
    : `<span class="exhausted">That is the whole catalogue.</span>`;
}

// The button is a real button, so keyboard users and anyone who prefers to
// click are not left out. Delegated from a container that survives re-renders.
$("#more").onclick = (e) => { if (e.target.id === "more-btn") run(true); };

// ...and it loads itself when scrolled into view. IntersectionObserver reports
// when an element enters the viewport, which is cheaper and steadier than
// measuring scroll position on every scroll event.
new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting && state.shown && !state.loading) run(true);
}, { rootMargin: "200px" }).observe($("#more"));

// --- detail panel -----------------------------------------------------------

// Friendlier wording for the measured structure axes, which are stored as
// percentile ranks across the catalogue rather than raw values.
const STRUCTURE_LABELS = {
  episode_count: "Episode count", season_count: "Seasons",
  episode_length: "Episode length", maturity: "Maturity",
  audience_rating: "Audience rating", is_miniseries: "Miniseries",
  rating_stdev: "Episode variability", slow_burn_slope: "Slow burn",
  finale_delta: "Finale-driven", vote_peak_ratio: "Standout episodes",
  guest_star_mean: "Ensemble size", entity_density: "Names to track",
  runtime_stdev: "Runtime variation",
};

$("#results").addEventListener("click", (e) => {
  const card = e.target.closest("[data-show]");
  if (card) openDetail(parseInt(card.dataset.show, 10));
});

// Identity comes from the httpOnly session cookie, which this script cannot
// read and does not need to. The server resolves the voter from the request.
let ME = null;

let currentShow = null;

function voteRow(axis, st) {
  const pct = Math.round(st.score * 100);
  const pressed = (d) => st.your_vote === d ? "true" : "false";
  // Drift is how far the crowd has moved the model. Shown only once it exists,
  // so an unvoted axis stays visually quiet.
  // Drift below half a display-unit rounds to "0.00" or, worse, "-0.00".
  // Showing nothing is more honest than showing a signed zero.
  const showDrift = Math.abs(st.drift) >= 0.005;
  const tally = st.n_votes
    ? `${st.n_votes} vote${st.n_votes === 1 ? "" : "s"}`
      + (showDrift ? ` <span class="drift">${st.drift > 0 ? "+" : "−"}${Math.abs(st.drift).toFixed(2)}</span>` : "")
    : "";
  // A fact is not up for a vote. TMDB settles whether a show is animated, so
  // offering buttons there would invite disagreement about a closed question -
  // and any vote cast would be refused by the server anyway.
  const controls = st.votable
    ? `<span class="votes">
        <button class="vote up"      data-dir="up"      aria-pressed="${pressed("up")}"      title="Should be higher">&#9650;</button>
        <button class="vote neutral" data-dir="neutral" aria-pressed="${pressed("neutral")}" title="This value is right">&#9679;</button>
        <button class="vote down"    data-dir="down"    aria-pressed="${pressed("down")}"    title="Should be lower">&#9660;</button>
      </span>`
    : `<span class="sourced" title="Set by the catalogue, not by voting">from TMDB</span>`;

  return `<div class="vbar${st.votable ? "" : " fact"}" data-axis="${axis}">
    <span>${axis.replace(/_/g, " ")}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="num">${st.score.toFixed(2)}</span>
    ${controls}
    <span class="tally">${st.votable ? tally : ""}</span>
  </div>`;
}

function bar(label, value, measured) {
  const pct = Math.round(value * 100);
  return `<div class="bar">
    <span>${label}</span>
    <span class="track"><span class="fill${measured ? " measured" : ""}" style="width:${pct}%"></span></span>
    <span class="num">${value.toFixed(2)}</span>
  </div>`;
}

async function openDetail(id) {
  currentShow = id;
  const s = await (await fetch(`/api/show/${id}`)).json();

  const poster = s.poster
    ? `<img src="https://image.tmdb.org/t/p/w185${s.poster}" alt="">`
    : `<div style="width:92px;height:138px;background:var(--panel-2);border-radius:6px"></div>`;

  // Measured axes come from TMDB fields and episode data; predicted axes come
  // from the trained model. They are shown separately and coloured
  // differently, because they carry very different confidence.
  const structure = Object.entries(s.structure)
    .map(([k, v]) => [STRUCTURE_LABELS[k] || k, v])
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => bar(k, v, true)).join("");

  const predicted = s.has_model
    ? s.axes_top.map(([axis, st]) => voteRow(axis, st)).join("")
    : `<div class="note">No trained model on disk — run training/train_model.py.</div>`;
  const facts = (s.axes_facts || []).map(([axis, st]) => voteRow(axis, st)).join("");

  $("#sheet").innerHTML = `
    <div class="sheet-head">
      ${poster}
      <div>
        <h2>${s.name}</h2>
        <div class="sub">${s.certificate ? `<span class="cert">${esc(s.certificate)}</span>` : ""}${s.year} · ${s.genres.join(", ") || "—"} · ${s.seasons} seasons,
          ${s.episodes} episodes · ★ ${s.rating}</div>
      </div>
      <button class="close" id="close-detail" aria-label="Close">&times;</button>
    </div>
    <p class="overview">${s.overview || "No synopsis available."}</p>

    <h4>Does this describe the show? — vote per axis</h4>
    <div class="bars" id="vote-bars">${predicted}</div>

    <h4>From the catalogue — not open to voting</h4>
    <div class="bars">${facts}</div>
    <div class="note">Genres and the age certificate come from TMDB and the
      classification body. A show is animated or it isn't, so these are looked up
      rather than polled — and the certificate also demotes results rated far from
      what you asked for.</div>
    <div class="note">
      <b>▲ higher · ● this is right · ▼ lower.</b> The question is whether the word
      <em>describes</em> the show — not whether the show is good. Your vote replaces
      any earlier one on the same axis.<br>
      Greyed axes come from TMDB and aren't open to voting: a show is animated or
      it isn't, so that's a fact to look up rather than an opinion to poll.<br>
      Scores start from the trained model and votes update it as evidence, weighted
      against how many votes that axis already has. Three up-votes nudge; twenty move
      it a long way. With no votes you see the model's own prediction.
    </div>

    <h4>Measured axes — from TMDB and episode data</h4>
    <div class="bars">${structure}</div>
    <div class="note">Percentile ranks across the 500-show catalogue. 0.90 means
      higher than 90% of the catalogue, not an absolute score.</div>

    <h4>Your library</h4>
    <div class="status-row" id="status-row">
      <button class="status" data-status="watchlist">Watchlist</button>
      <button class="status" data-status="watching">Watching</button>
      <button class="status" data-status="watched">Watched</button>
    </div>

    <h4>Your review</h4>
    <textarea id="review-box" placeholder="What was it actually like to watch? Was it tense, slow, funny, frightening?"></textarea>
    <div class="sheet-actions" style="margin-top:8px">
      <button class="btn" id="save-review">Save review</button>
      <span class="note" id="review-msg" style="align-self:center;margin:0"></span>
    </div>
    <div class="note">Reviews are the text the scoring model learns from — a synopsis
      can say a house is haunted, only a viewer can say it made them jump.</div>
    <div id="review-list"></div>

    <h4>Most distinctive keywords</h4>
    <div class="chips">${s.top_keywords.map((k) => `<span class="chip">${k}</span>`).join("") || "—"}</div>

    <div class="sheet-actions">
      <button class="btn" id="find-similar">Find shows like this</button>
      <button class="btn ghost" id="close-detail-2">Close</button>
    </div>`;

  $("#detail").hidden = false;

  // Votes update one row in place rather than re-rendering the panel, so the
  // page does not jump under the cursor when someone votes several axes.
  const bars = $("#vote-bars");
  if (bars) bars.onclick = async (e) => {
    const btn = e.target.closest("[data-dir]");
    if (!btn) return;
    const row = btn.closest("[data-axis]");
    const axis = row.dataset.axis;
    const shown = parseFloat(row.querySelector(".num").textContent);

    const res = await fetch("/api/vote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        show_id: currentShow, axis, direction: btn.dataset.dir,
        score_shown: shown,
      }),
    });
    if (res.status === 401) { location.href = "/"; return; }
    if (!res.ok) return;
    const { state } = await res.json();
    row.outerHTML = voteRow(axis, state);
  };

  // --- library status -------------------------------------------------------
  const row = $("#status-row");
  for (const b of row.querySelectorAll("[data-status]")) {
    b.setAttribute("aria-pressed", String(s.library_status === b.dataset.status));
  }
  row.onclick = async (e) => {
    const b = e.target.closest("[data-status]");
    if (!b) return;
    // Clicking the active status clears it, so a show can be removed without a
    // separate delete control.
    const on = b.getAttribute("aria-pressed") === "true";
    const res = await fetch("/api/library", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ show_id: currentShow, status: on ? null : b.dataset.status }),
    });
    if (res.status === 401) { location.href = "/"; return; }
    for (const other of row.querySelectorAll("[data-status]")) {
      other.setAttribute("aria-pressed", String(!on && other === b));
    }
  };

  // --- review ---------------------------------------------------------------
  $("#review-box").value = s.my_review || "";
  renderReviews(s.reviews);
  $("#save-review").onclick = async () => {
    const msg = $("#review-msg");
    msg.textContent = "";
    const res = await fetch("/api/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ show_id: currentShow, body: $("#review-box").value }),
    });
    if (res.status === 401) { location.href = "/"; return; }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = body.detail || "Could not save."; return; }
    msg.textContent = "Saved.";
    renderReviews(body.reviews);
  };

  $("#close-detail").onclick = closeDetail;
  $("#close-detail-2").onclick = closeDetail;
  $("#find-similar").onclick = () => {
    closeDetail();
    switchMode("show");
    pickShow(id);
  };
}

function closeDetail() { $("#detail").hidden = true; }

// Escape user text before putting it in the DOM. Reviews are written by other
// people, so inserting them as HTML would be a stored-XSS hole.
function esc(t) {
  return String(t).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderReviews(reviews) {
  const el = $("#review-list");
  if (!el) return;
  el.innerHTML = (reviews || []).map((r) => `
    <div class="review">
      <div class="by">${esc(r.username)} · ${esc((r.created_at || "").slice(0, 10))}</div>
      ${esc(r.body)}
    </div>`).join("");
}

// --- account bar ------------------------------------------------------------
async function loadAccount() {
  const { user } = await (await fetch("/api/me")).json();
  ME = user;
  const el = $("#account");
  if (!user) {
    el.innerHTML = `<a class="btn" href="/">Sign in</a>`;
    return;
  }
  el.innerHTML = `
    <span class="who">Signed in as <b>${esc(user.username)}</b></span>
    <span class="libtabs">
      <button class="libtab" data-lib="watchlist">Watchlist</button>
      <button class="libtab" data-lib="watched">Watched</button>
      <button class="libtab" data-lib="history">History</button>
    </span>
    <button class="btn ghost" id="logout">Log out</button>`;

  $("#logout").onclick = async () => {
    await fetch("/api/logout", { method: "POST" });
    location.href = "/";
  };

  el.querySelector(".libtabs").onclick = async (e) => {
    const b = e.target.closest("[data-lib]");
    if (!b) return;
    const which = b.dataset.lib;
    const url = which === "history" ? "/api/history" : `/api/library?status=${which}`;
    const data = await (await fetch(url)).json();
    const rows = data.rows.map((r) => ({ ...r.show, score: 0, block_scores: {}, explanation: "" }));
    $("#meta").innerHTML = `${rows.length} in <b>${which}</b>`;
    $("#results").innerHTML = rows.length
      ? rows.map(showCard).join("")
      : `<div class="empty">Nothing in ${which} yet.</div>`;
    // A library listing is not a ranking, so there is no next page to offer.
    clearPaging();
  };
}

// One card renderer, used by both search results and library listings.
function showCard(r) {
  const poster = r.poster
    ? `<img src="https://image.tmdb.org/t/p/w92${r.poster}" alt="" loading="lazy">`
    : `<div style="width:56px;height:84px;background:var(--panel-2);border-radius:4px"></div>`;
  const parts = Object.entries(r.block_scores || {})
    .map(([k, v]) => `${k[0]}${v.toFixed(2)}`).join(" · ");
  return `
    <article class="card" data-show="${r.id}">
      ${poster}
      <div>
        <h3>${esc(r.name)}</h3>
        <div class="sub">${r.certificate ? `<span class="cert">${esc(r.certificate)}</span>` : ""}${esc(r.year)} · ${esc((r.genres || []).join(", ") || "—")} · ${r.episodes} eps · ★ ${r.rating}</div>
        <div class="why">${esc(r.explanation || (r.overview || "").slice(0, 120))}</div>
      </div>
      <div class="score">
        ${r.score ? `<div class="big">${(r.score * 100).toFixed(0)}</div><div class="parts">${parts}</div>` : ""}
      </div>
    </article>`;
}

loadAccount();

// Click the backdrop or press Escape to dismiss - both are expected.
$("#detail").onclick = (e) => { if (e.target.id === "detail") closeDetail(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#detail").hidden) closeDetail();
});

// --- tabs -------------------------------------------------------------------

$("#tab-show").onclick = () => switchMode("show");
$("#tab-pref").onclick = () => switchMode("pref");

function switchMode(mode) {
  state.mode = mode;
  $("#tab-show").setAttribute("aria-selected", String(mode === "show"));
  $("#tab-pref").setAttribute("aria-selected", String(mode === "pref"));
  $("#panel-show").hidden = mode !== "show";
  $("#panel-pref").hidden = mode !== "pref";
  $("#chosen").innerHTML = mode === "show" ? $("#chosen").innerHTML : "";
  run();
}

boot();
</script>
</body>
</html>
